<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Champions Builder</title>
    <link rel="stylesheet" href="styles.css?v=110">
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-label="Champions Builder">
        <div class="hero-copy">
          <h1>Champions Builder</h1>
        </div>
      </section>

      <section class="toolbar" aria-label="Filters">
        <div class="toolbar-primary">
          <label class="search">
            <span>Zoeken</span>
            <input id="searchInput" type="search" placeholder="Naam, type of ability">
          </label>
          <label class="sort-quick">
            <span>Sorteren</span>
            <select id="sortSelect">
              <option value="name">Naam</option>
              <option value="bst">BST</option>
              <option value="offense">Hoogste aanval</option>
              <option value="bulk">Bulk</option>
              <option value="spe">Speed</option>
              <option value="atk">Attack</option>
              <option value="def">Defense</option>
              <option value="spa">Sp. Atk</option>
              <option value="spd">Sp. Def</option>
              <option value="hp">HP</option>
            </select>
          </label>
          <button id="showAllPokemon" class="show-all-button" type="button">Lijst alle Mons</button>
          <button id="guideModeToggle" class="guide-mode-button" type="button" aria-pressed="false">
            <span class="guide-mode-icon" aria-hidden="true"></span>
            <span>Help mij kiezen</span>
          </button>
          <button id="favoritesToggle" class="favorites-toggle-button" type="button" aria-pressed="false">Favorieten</button>
          <button id="randomUltraTeam" class="ultra-team-button" type="button">Willekeurig Ultra Team</button>
          <button id="resetApp" class="reset-button" type="button">Reset alles</button>
        </div>
        <details class="toolbar-drawer">
          <summary>Filters & teamregels</summary>
          <div class="toolbar-controls">
            <label>
              <span>Focus</span>
              <select id="sourceSelect">
                <option value="all">Alles tonen</option>
                <option value="mega">Alleen Mega's</option>
                <option value="noMega">Geen Mega's</option>
                <option value="strongSets">Sterke setdata</option>
                <option value="fast">Snelheid</option>
                <option value="bulky">Bulk / switch-in</option>
                <option value="physical">Fysieke druk</option>
                <option value="special">Speciale druk</option>
              </select>
            </label>
            <label>
              <span>Teamplan</span>
              <select id="teamStyleSelect">
                <option value="balanced">Gebalanceerd</option>
                <option value="offense">Offensief</option>
                <option value="bulky">Bulky</option>
                <option value="rain">Rain</option>
                <option value="sun">Sun</option>
                <option value="trickroom">Trick Room</option>
                <option value="doublesupport">Double support</option>
                <option value="hyperoffense">Hyper Offense</option>
                <option value="voltturn">VoltTurn</option>
                <option value="sand">Sand</option>
                <option value="snow">Snow</option>
                <option value="stall">Stall</option>
                <option value="antiMeta">Anti-meta</option>
              </select>
            </label>
            <label>
              <span>Rol</span>
              <select id="roleFilterSelect">
                <option value="all">Alle rollen</option>
                <option value="Sweeper">Sweeper</option>
                <option value="Wallbreaker">Wallbreaker</option>
                <option value="Support">Support</option>
                <option value="Wall">Wall</option>
                <option value="Speed control">Speed control</option>
                <option value="Bulky pivot">Bulky pivot</option>
              </select>
            </label>
            <label class="format-filter">
              <span>Format</span>
              <select id="battleFormatSelect">
                <option value="single3">Single 3v3</option>
                <option value="double4">Double 4v4</option>
              </select>
            </label>
            <div class="type-panel" aria-label="Typefilters">
              <div class="filter-head">
                <button id="typeToggle" class="type-toggle" type="button" aria-expanded="false">Types</button>
                <strong id="activeTypeLabel">Alle types</strong>
              </div>
              <div class="type-strip" id="typeFilters"></div>
            </div>
          </div>
        </details>
      </section>

      <section class="meta-row" aria-live="polite">
        <div>
          <strong id="resultCount">0</strong>
          <span id="resultLabel">resultaten</span>
        </div>
      </section>

      <nav class="view-tabs" aria-label="Weergave">
        <button id="builderTab" class="view-tab active" type="button">Builder</button>
        <button id="teamTab" class="view-tab" type="button">Team lab</button>
      </nav>

      <section id="builderView" class="tab-view active" aria-label="Builder">
        <div class="workspace">
          <nav class="team-quick-nav builder-team-quick-nav" id="builderTeamQuickNav" aria-label="Builder team snelnavigatie" hidden></nav>
          <section class="grid" id="pokemonGrid" aria-label="Pokémon"></section>

          <aside class="side-panel" aria-label="Details en team">
            <section class="team">
              <div class="panel-head">
                <h2>Team</h2>
                <button id="clearTeam" type="button">Leegmaken</button>
              </div>
              <div class="team-slots" id="teamSlots"></div>
            </section>
            <section class="detail" id="detailPanel"></section>
            <section class="team-overview" id="teamOverview" aria-live="polite"></section>
          </aside>
        </div>
      </section>

      <section id="teamView" class="tab-view" aria-label="Team lab">
        <div class="team-lab">
          <nav class="team-quick-nav" id="teamQuickNav" aria-label="Team snelnavigatie"></nav>
          <section class="team-workbench-panel">
            <div class="panel-head">
              <h2>Team aanpassen</h2>
              <button id="backToBuilder" type="button" hidden>Naar builder</button>
            </div>
            <section class="team-manager" id="teamManager" aria-label="Teams opslaan en laden"></section>
            <div class="team-workbench" id="teamWorkbench" aria-live="polite"></div>
          </section>
          <section class="team-analysis" id="teamAnalysis" aria-live="polite"></section>
        </div>
      </section>

      <button id="floatingTeamLab" class="floating-team-lab" type="button" hidden>
        <span>Team lab</span>
        <strong id="floatingTeamCount">0/3</strong>
      </button>
      <section id="floatingCompare" class="floating-compare" aria-live="polite"></section>
      <button id="goTopButton" class="go-top-button" type="button" hidden>↑</button>
    </main>

    <template id="cardTemplate">
      <article class="pokemon-card">
        <button class="card-button" type="button">
          <span class="sprite-wrap"><img class="sprite" alt=""></span>
          <span class="card-main">
            <span class="card-top">
              <strong class="name"></strong>
              <span class="bst"></span>
            </span>
            <span class="types"></span>
            <span class="abilities"></span>
          </span>
        </button>
        <button class="add-button" type="button" title="Toevoegen aan team">+</button>
      </article>
    </template>

    <script src="data/local-data.js"></script>
    <script type="module" src="app.js?v=105"></script>
  </body>
</html>
